<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · The Roll &amp; Momos</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffaf3;
        color: #17100e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        background: #fff;
        border: 1px solid rgba(23, 16, 14, 0.1);
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 18px 40px -24px rgba(35, 26, 23, 0.45);
      }
      .emoji {
        font-size: 3.5rem;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(23, 16, 14, 0.65);
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 26px;
        border-radius: 999px;
        background: #dc2a15;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
      .phone {
        margin-top: 18px;
        font-size: 0.85rem;
        color: rgba(23, 16, 14, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🥟</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Our momos are still hot, but your internet is not. Reconnect and this page
        will load again.
      </p>
      <a href="/">Try again</a>
      <p class="phone">Hungry now? Call us on +91 97793 32204.</p>
    </div>
  </body>
</html>
